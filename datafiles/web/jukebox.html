<!doctype html>
<html><head><meta charset="utf-8"><title>ZALiA Jukebox</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Every colour is a variable so the THEME blocks at the bottom are pure palette
   swaps. Same variable names and same four palettes as tracker.html, so a
   streamer running both gets a matched pair rather than two unrelated pages. */
:root {
  color-scheme: dark;
  --void:#2b2f4a;   /* page + header ground        */
  --panel:#232741;  /* footer / transport ground   */
  --edge:#4a4f75;   /* rules and dividers          */
  --ink:#e8e8f0;    /* body text                   */
  --btn:#3a3f63; --btn-edge:#5b608c; --btn-hover:#4a5080;
  --btn-on-bg:#ffffff; --btn-on-ink:#222222;
  --field:#1f2338;  /* search box / inputs         */
  --accent:#8ef7b0; /* NOW PLAYING + slider fill   */
  --sel:#5b6bb5;    /* SELECTED row                */
  --radius:4px;
}
* { box-sizing: border-box; }
body { margin:0; font:14px ui-monospace,Consolas,monospace; background:var(--void); color:var(--ink); }
header { padding:10px 14px; display:flex; gap:12px; align-items:baseline;
         border-bottom:1px solid var(--edge); position:sticky; top:0; background:var(--void); z-index:2; }
h1 { font-size:15px; margin:0; letter-spacing:.08em; }
.count { margin-left:auto; opacity:.7; }
.row { display:flex; flex-wrap:wrap; gap:6px; padding:8px 14px; }
button { font:inherit; padding:7px 12px; border:1px solid var(--btn-edge); border-radius:var(--radius);
         background:var(--btn); color:var(--ink); cursor:pointer; }
button:hover { background:var(--btn-hover); }
button.on { background:var(--btn-on-bg); color:var(--btn-on-ink); }
#q { width:100%; padding:8px 10px; font:inherit; border-radius:var(--radius);
     border:1px solid var(--btn-edge); background:var(--field); color:var(--ink); }
main { padding:0 14px 14px; }
.t { display:grid; grid-template-columns:14px 180px 1fr 52px; gap:12px; align-items:baseline;
     padding:6px 8px; border-radius:var(--radius); cursor:pointer; }
.t .len { opacity:.45; font-size:12px; text-align:right; }
.seekrow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.seekrow input[type=range] { flex:1; accent-color:var(--accent); }
.time { opacity:.6; font-size:12px; min-width:38px; }
.volrow { display:flex; align-items:center; gap:10px; margin-top:8px; }
.volrow input[type=range] { width:150px; accent-color:var(--accent); }
.volrow .lbl { opacity:.6; font-size:12px; }
.t:hover { background:var(--btn); }
/* SELECTED (what a zone button will act on) and NOW PLAYING are different
   things and must not look the same -- you can be assigning one track while
   another is playing. */
.t.sel { background:var(--sel); }
.t.now .title { color:var(--accent); font-weight:bold; }
.t .spk { color:var(--accent); font-size:11px; }
.t .game { opacity:.6; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t.sel .game { opacity:.85; }
footer { position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--edge); padding:10px 14px; }
.hint { opacity:.8; margin-bottom:8px; min-height:1.2em; }
.zones button { flex:1 1 90px; }
.transport button { flex:1; }

/* theme picker -- lives in the header so it never covers the transport bar */
#themesel { font:inherit; font-size:12px; background:var(--field); color:var(--ink);
            border:1px solid var(--btn-edge); border-radius:var(--radius); padding:3px 5px; }

/* ===========================================================================
   THEMES -- palettes shared with tracker.html so the two pages match.
   Named for the PALETTE, not for games they never really resembled.
   Adding one = a new block plus a new <option>.
   =========================================================================== */

/* ---- SANDSTONE: black status field, tan ground, gold lettering ------------ */
body[data-theme="sandstone"] {
  --void:#000000; --panel:#1a1408; --edge:#d4c896; --ink:#f8ecd0;
  --btn:#5c4a26; --btn-edge:#d4c896; --btn-hover:#7a6434;
  --btn-on-bg:#f8b800; --btn-on-ink:#241a00;
  --field:#2a2010; --accent:#78f878; --sel:#7a6434; --radius:0px;
}
/* NES boxes notch their corners rather than curving them; --radius:0 above plus
   the gold rule here is the whole look. Headings take the status-bar gold. */
body[data-theme="sandstone"] h1 { color:#f8b800; text-shadow:1px 1px 0 #000; }
body[data-theme="sandstone"] header,
body[data-theme="sandstone"] footer { border-color:#f8b800; }

/* ---- SAPPHIRE: blue command window in silver chrome ----------------------- */
body[data-theme="sapphire"] {
  --void:#0a1030; --panel:#0d1642; --edge:#eef2ff; --ink:#ffffff;
  --btn:#1c3f8a; --btn-edge:#eef2ff; --btn-hover:#2a55b0;
  --btn-on-bg:#ffd657; --btn-on-ink:#241800;
  --field:#16224f; --accent:#7cf0d2; --sel:#2a55b0; --radius:6px;
}
/* The double rule is the signature -- same trick as the tracker: `double` is a
   real border-style that draws two parallel lines with a gap for free. */
body[data-theme="sapphire"] header { border-bottom:4px double var(--edge); }
body[data-theme="sapphire"] footer { border-top:4px double var(--edge); }
body[data-theme="sapphire"] button { box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
body[data-theme="sapphire"] { text-shadow:1px 1px 0 rgba(0,0,20,.75); }

/* ---- GOTHIC: candlelit stone and tarnished gold -------------------------- */
body[data-theme="gothic"] {
  --void:#0a0609; --panel:#221521; --edge:#8a6d3a; --ink:#ede0c8;
  --btn:#2c2030; --btn-edge:#8a6d3a; --btn-hover:#3d2c42;
  --btn-on-bg:#d8b34a; --btn-on-ink:#241505;
  --field:#171019; --accent:#4fcf8f; --sel:#4a2b3d; --radius:2px;
}
body[data-theme="gothic"] h1 {
  font-family:Georgia,"Times New Roman",serif; letter-spacing:.22em; color:#d8b34a;
  text-shadow:0 1px 0 rgba(0,0,0,.7), 0 0 10px rgba(216,179,74,.25);
}

/* ---- VELLUM: the light one ----------------------------------------------- */
body[data-theme="vellum"] {
  --void:#e9dfc4; --panel:#e2d3a9; --edge:#8a7040; --ink:#241a10;
  --btn:#dbc99a; --btn-edge:#8a7040; --btn-hover:#cdb87f;
  --btn-on-bg:#8a6a12; --btn-on-ink:#f6efd8;
  --field:#f1e8d2; --accent:#3d6b3f; --sel:#c9b485; --radius:3px;
  color-scheme: light;   /* so the native range/scrollbar chrome flips too */
}
body[data-theme="vellum"] {
  font-family:Georgia,"Times New Roman",serif;
}
body[data-theme="vellum"] h1 { font-variant:small-caps; letter-spacing:.14em; }
</style></head><body>
<header>
  <h1>ZALiA JUKEBOX</h1>
  <span class="count" id="count"></span>
  <select id="themesel" onchange="setTheme(this.value)" title="page theme">
    <option value="">MIDNIGHT</option>
    <option value="sandstone">SANDSTONE</option>
    <option value="sapphire">SAPPHIRE</option>
    <option value="gothic">GOTHIC</option>
    <option value="vellum">VELLUM</option>
  </select>
</header>
<div class="row" id="playlists"></div>
<div class="row"><input id="q" placeholder="type to search..." autocomplete="off"></div>
<main id="list"></main>
<footer>
  <div class="seekrow">
    <span id="tnow" class="time">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <span id="tlen" class="time">0:00</span>
  </div>
  <div class="hint" id="hint">click a track, then pick a zone to assign it</div>
  <div class="row zones" id="zones" style="padding:0"></div>
  <div class="row transport" style="padding:0;margin-top:8px">
    <button onclick="cmd('prev')">&lt;&lt; PREV</button>
    <button id="pausebtn" onclick="togglePause()">PAUSE</button>
    <button onclick="cmd('stop','stopped - no music playing')">STOP</button>
    <button onclick="cmd('start','started')">START</button>
    <button onclick="randomTrack()">RANDOM</button>
    <button onclick="cmd('next')">NEXT &gt;&gt;</button>
  </div>
  <div class="row transport" style="padding:0;margin-top:6px">
    <!-- One button that cycles, not three radio buttons: there are only three states
         and the label always says which one you are in, so a second click undoes a
         misclick immediately. -->
    <button id="modebtn" onclick="cycleMode()"
            title="what happens when a track finishes">MODE: PLAY ALL</button>
    <button onclick="cmd('off','jukebox off - the game\'s own music is back')"
            title="leave jukebox mode and hand music back to the game">BACK TO GAME MUSIC</button>
  </div>
  <div class="volrow">
    <span class="lbl">VOL</span>
    <input type="range" id="vol" min="0" max="10" step="1" value="5">
    <span class="lbl" id="volval">5</span>
  </div>
</footer>
<script>
// TUNNELS is the town-to-town fast-travel basements -- seven rooms sharing the
// _Basement01 theme. Split out of TOWN so a track can go in the tunnels ONLY.
const ZONES = ["TITLE","OVERWORLD","TOWN","DUNGEON","BOSS","ENDING","MINIGAME","TUNNELS"];
const PL    = ["OG","REMIX","MY MIX","ALL","FOLDER"];
const MYMIX = 2;   // JukeboxPL.MY_NESMIX -- the owner's own imports

let tracks = [], tags = {}, sel = null, playlist = 0, booted = false;
let nowAsset = '', curLen = 0, seeking = false, isPaused = false;

// PAUSE holds the playhead. STOP is silence and forgets it. "BACK TO GAME MUSIC"
// is the only one that hands the soundtrack back to the game.
function togglePause() {
  cmd(isPaused ? 'resume' : 'pause', isPaused ? 'resumed' : 'paused');
  isPaused = !isPaused;
  pausebtn.textContent = isPaused ? 'RESUME' : 'PAUSE';
}

// PLAY MODE: what happens when a track ends. Must match the JB_* macros in
// macros.gml -- 0 REPEAT, 1 ADVANCE, 2 SHUFFLE.
//
// Tracked here rather than read back from the game because there is no status
// endpoint for it: /cmd is a one-way file drop. That means this can drift if the
// mode is changed in-game, so the button reports what it LAST SET, and the game
// shows its own confirmation on screen when it changes.
const MODES = [
  { cmd:'repeat',  label:'MODE: REPEAT ONE', hint:'the same track over and over' },
  { cmd:'advance', label:'MODE: PLAY ALL',   hint:'plays down the list in order' },
  { cmd:'shuffle', label:'MODE: SHUFFLE',    hint:'random next, never the same track twice in a row' }
];
let modeIdx = 1;   // ADVANCE, matching jukebox_init's default
function applyMode() { modebtn.textContent = MODES[modeIdx].label; }
function cycleMode() {
  modeIdx = (modeIdx + 1) % MODES.length;
  applyMode();
  cmd('mode ' + MODES[modeIdx].cmd, MODES[modeIdx].hint);
}

const label = t => (t.game ? t.game + ' - ' : '') + t.title;
const mmss  = s => (s > 0 ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '');

async function cmd(c, human) {
  await fetch('/cmd?c=' + encodeURIComponent(c));
  if (human) hint.textContent = human;
}

async function load() {
  if (!Object.keys(tags).length) {
    try { tags = await (await fetch('/tags')).json(); } catch (e) { tags = {}; }
  }
  const d = await (await fetch('/list')).json();
  playlist = d.playlist || 0;
  tracks = (d.tracks || []).map(t => {
    const g = tags[t.asset] || {};
    return Object.assign({}, t, { game: g.game || '', title: g.title || t.name });
  });
  count.textContent = (d.count || 0) + ' tracks';
  draw(); drawPlaylists();

  // Land on MY MIX, not ALL: the packs that ship with the game are already
  // playable in-game and just bury the owner's own imports.
  if (!booted) {
    booted = true;
    if (playlist !== MYMIX) { await cmd('playlist ' + MYMIX); setTimeout(load, 700); }
  }
}

function drawPlaylists() {
  playlists.innerHTML = '';
  PL.forEach((p, i) => {
    const b = document.createElement('button');
    b.textContent = p; if (i === playlist) b.className = 'on';
    b.onclick = async () => { await cmd('playlist ' + i); setTimeout(load, 700); };
    playlists.append(b);
  });
}

function draw() {
  const f = q.value.trim().toLowerCase();
  list.innerHTML = '';
  for (const t of tracks) {
    if (f && !(t.game + ' ' + t.title).toLowerCase().includes(f)) continue;
    const d = document.createElement('div');
    const isNow = nowAsset && t.asset === nowAsset;
    d.className = 't' + (sel === t.idx ? ' sel' : '') + (isNow ? ' now' : '');
    d.innerHTML = '<span class="spk"></span><span class="game"></span>'
                + '<span class="title"></span><span class="len"></span>';
    d.querySelector('.spk').textContent   = isNow ? '▶' : '';
    d.querySelector('.game').textContent  = t.game || '';
    d.querySelector('.title').textContent = t.title;
    d.querySelector('.len').textContent   = mmss(t.len || 0);
    d.onclick = () => { sel = t.idx; cmd('play ' + t.idx, 'playing  ' + label(t)); draw(); };
    list.append(d);
  }
}

// Pick from what is ACTUALLY on screen: if a search is filtering the list,
// "random" should mean random out of what you can see, not the whole playlist.
function randomTrack() {
  const f = q.value.trim().toLowerCase();
  const pool = tracks.filter(t => !f || (t.game + ' ' + t.title).toLowerCase().includes(f));
  if (!pool.length) { hint.textContent = 'nothing to pick from'; return; }
  const t = pool[Math.floor(Math.random() * pool.length)];
  sel = t.idx;
  cmd('play ' + t.idx, 'random  ->  ' + label(t));
  draw();
}

// Follow the game, not just our own clicks: next/prev on the controller, the
// in-game jukebox HUD and auto-advance all move the track without us knowing.
async function pollNow() {
  try {
    const n = await (await fetch('/now')).json();
    const a = n.on ? (n.asset || '') : '';
    if (a !== nowAsset) { nowAsset = a; draw(); }

    curLen = n.len || 0;
    tlen.textContent = mmss(curLen);
    tnow.textContent = mmss(n.pos || 0);
    // Don't fight the user's thumb while they are dragging.
    if (!seeking && curLen > 0) seek.value = Math.round((n.pos / curLen) * 1000);

    if (document.activeElement !== vol) { vol.value = n.vol; volval.textContent = n.vol; }

    isPaused = !!n.paused;
    pausebtn.textContent = isPaused ? 'RESUME' : 'PAUSE';
  } catch (e) { /* game closed; keep the last view rather than blanking it */ }
}

seek.addEventListener('input',  () => { seeking = true;
  if (curLen > 0) tnow.textContent = mmss((seek.value / 1000) * curLen); });
seek.addEventListener('change', () => {
  if (curLen > 0) cmd('seek ' + ((seek.value / 1000) * curLen).toFixed(2));
  seeking = false;
});

vol.addEventListener('input', () => { volval.textContent = vol.value; });
vol.addEventListener('change', () => cmd('vol ' + vol.value));

setInterval(pollNow, 1000);

ZONES.forEach((z, i) => {
  const b = document.createElement('button');
  b.textContent = z;
  b.onclick = () => {
    if (sel === null) { hint.textContent = 'pick a track first'; return; }
    const t = tracks.find(x => x.idx === sel);
    // by NAME, not index: an index is only valid for the playlist the game
    // currently holds, and this page's copy can be stale.
    cmd('assignname ' + t.asset + ' ' + i, label(t) + '   ->   plays in ' + z);
  };
  zones.append(b);
});
// THEME. Shares the key 'zalia_theme' with the tracker deliberately -- pick a look
// on one page and the other matches, which is the point of using one palette set.
// ?theme=NAME still wins over the stored choice, same rule as the tracker.
function setTheme(name, remember) {
  if (name) document.body.setAttribute('data-theme', name);
  else      document.body.removeAttribute('data-theme');
  const sel = document.getElementById('themesel');
  if (sel) sel.value = name || '';
  if (remember !== false) {
    try { localStorage.setItem('zalia_theme', name || ''); } catch (e) {}
  }
}
(function initTheme() {
  let t = new URLSearchParams(location.search).get('theme');
  if (t === null) { try { t = localStorage.getItem('zalia_theme'); } catch (e) { t = null; } }
  setTheme(t || '', false);
})();

q.oninput = draw;
applyMode();
load();
</script></body></html>
